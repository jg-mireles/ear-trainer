<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harmonic Ear Trainer</title>
  <link rel="stylesheet" href="styles.css?v=32" />
  <!-- External Audio, Music Theory, and Notation Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tonal/browser/tonal.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
</head>
<body>
  <div class="app-shell">
    <header>
      <div>
        <h1>Harmonic Ear Trainer</h1>
        <div class="mode-toggle" style="margin-top: 8px; display: inline-flex;">
          <button type="button" id="nav-intervals" class="active">1. Intervals</button>
          <button type="button" id="nav-chords">2. Chords & Inversions</button>
        </div>
      </div>
      <span id="status-badge">Loading piano samples...</span>
    </header>

    <!-- Shared Controls & Harmonic Synth Lab (ControlsPanel.js) -->
    <div id="controls-container"></div>

    <!-- VIEW A: Interval Answer Deck -->
    <section id="interval-quiz-section" class="panel-card">
      <div class="section-header">
        <h2>3. Identify the Interval</h2>
      </div>
      <div id="quiz-grid" class="quiz-grid"></div>
      <p id="feedback-text">Selected Key: C Major (Tonic = C) — click "New Interval" to begin.</p>
      <div style="margin-top: 10px;">
        <button type="button" id="btn-context" class="primary-btn hidden">
          Hear in Context (Tonic Triad → Scale → Interval ↑)
        </button>
      </div>
      <div id="harmony-context-container"></div>
    </section>

    <!-- VIEW B: Single Chords & Inversions Deck (ChordQuizPanel.js) -->
    <div id="chord-quiz-container" class="hidden"></div>

    <!-- Shared Grand Staff Display -->
    <section class="panel-card">
      <div id="staff-container" class="staff-wrapper"></div>
    </section>
  </div>

  <script type="module" src="main.js?v=32"></script>
</body>
</html>
